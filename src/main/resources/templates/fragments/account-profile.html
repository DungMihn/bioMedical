<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="profileTab">

  <!-- TAB 2: PERSONAL INFO -->
  <div id="tabProfile" style="display:none;">
    <div class="account-page-profile">
      <h4 class="text-primary mb-3">
        <span class="lnr lnr-user mr-2"></span><b>Personal Information</b>
      </h4>

      <!-- ✅ Khu vực thông báo -->
      <div id="ajaxMessage"></div>

      <!-- ✅ Form cập nhật thông tin cá nhân -->
      <form th:object="${user}"
            th:action="@{/user/update-profile}"
            method="post"
            id="profileForm"
            novalidate>

        <div class="form-group">
          <label>Full Name <span class="text-danger">*</span></label>
          <input th:field="*{fullName}" class="form-control" required>
          <div class="invalid-feedback">Please enter your full name.</div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input th:field="*{email}" class="form-control" readonly disabled>
        </div>

        <div class="form-group">
          <label>Phone Number <span class="text-danger">*</span></label>
          <input th:field="*{phone}"
                 class="form-control"
                 pattern="^(0|\\+84)[0-9]{9,10}$"
                 title="Phone must start with 0 or +84 and contain 10–11 digits."
                 required>
          <div class="invalid-feedback">Phone number must be 10 digits starting with 0.</div>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select th:field="*{gender}" class="form-control">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date of Birth <span class="text-danger">*</span></label>
          <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
          <div class="invalid-feedback">Please select your date of birth.</div>
        </div>

        <div class="text-right">
          <button type="submit" class="btn btn-primary px-4" id="btnSave">
            <span class="lnr lnr-checkmark-circle mr-2"></span> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ✅ Script validate + AJAX submit -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById('profileForm');
      const msgBox = document.getElementById('ajaxMessage');
      const btnSave = document.getElementById('btnSave');

      form.addEventListener('submit', function (event) {
        event.preventDefault(); // ❌ Không reload
        event.stopPropagation();

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        // 🔄 Hiển thị spinner tạm thời
        btnSave.disabled = true;
        btnSave.innerHTML = '<span class="spinner-border spinner-border-sm mr-2"></span> Saving...';

        const formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData
        })
        .then(response => {
          if (response.ok) {
            // ✅ Hiển thị thông báo thành công
            msgBox.innerHTML = `
              <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="lnr lnr-checkmark-circle mr-2"></i>
                Profile updated successfully!
                <button type="button" class="close" data-dismiss="alert">&times;</button>
              </div>
            `;
          } else {
            throw new Error("Update failed");
          }
        })
        .catch(error => {
          // ❌ Hiển thị lỗi
          msgBox.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
              <i class="lnr lnr-warning mr-2"></i>
              An error occurred. Please try again later.
              <button type="button" class="close" data-dismiss="alert">&times;</button>
            </div>
          `;
          console.error("Error:", error);
        })
        .finally(() => {
          // 🔁 Khôi phục nút
          btnSave.disabled = false;
          btnSave.innerHTML = '<span class="lnr lnr-checkmark-circle mr-2"></span> Save Changes';

          // ⏳ Tự ẩn thông báo sau 3 giây
          setTimeout(() => {
            msgBox.innerHTML = '';
          }, 3000);
        });
      }, false);
    });
  </script>

</th:block>
</html>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Register</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="login/images/icons/favicon.ico"/>
	<link rel="stylesheet" type="text/css" href="login/vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="login/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="login/fonts/Linearicons-Free-v1.0.0/icon-font.min.css">
	<link rel="stylesheet" type="text/css" href="login/vendor/animate/animate.css">
	<link rel="stylesheet" type="text/css" href="login/vendor/css-hamburgers/hamburgers.min.css">
	<link rel="stylesheet" type="text/css" href="login/vendor/select2/select2.min.css">
	<link rel="stylesheet" type="text/css" href="login/css/util.css">
	<link rel="stylesheet" type="text/css" href="login/css/main.css">

	<style>
		/* fix con mắt nằm trong ô */
		.btn-show-pass {
			position: absolute;
			right: 10px;
			top: 50%;
			transform: translateY(-50%);
			cursor: pointer;
			color: #999;
		}
		.wrap-input100 {
			position: relative;
		}
		/* thu gọn form */
		.wrap-login100 {
			max-width: 450px;
		}
	</style>
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100 p-l-50 p-r-50 p-t-50 p-b-30">
				<form class="login100-form validate-form" th:action="@{/register}" th:object="${user}" method="POST">
					
					<span class="login100-form-title p-b-25">
						User Registration
					</span>
                                    
                                    <!--xem lỗi--> 
<!-- Global error message -->
<div th:if="${errorMessage}" class="alert alert-danger text-center m-t-15">
    <span th:text="${errorMessage}"></span>
</div>

<!-- Validation errors -->
<div th:if="${validationErrors}" class="alert alert-warning m-t-15">
    <ul>
        <li th:each="err : ${validationErrors}" th:text="${err.defaultMessage}"></li>
    </ul>
</div>


					<!-- Username -->
<div class="wrap-input100 m-b-16">
    <input class="input100" type="text" th:field="*{username}" placeholder="Username" required>
    <span class="focus-input100"></span>
    <span class="symbol-input100"><span class="lnr lnr-user"></span></span>

    <!-- Hiển thị lỗi cho username -->
    <div th:if="${#fields.hasErrors('username')}" class="text-danger">
        <p th:each="err : ${#fields.errors('username')}" th:text="${err}"></p>
    </div>
</div>

					<!-- Full Name -->
					<div class="wrap-input100 m-b-16">
						<input class="input100" type="text" th:field="*{fullName}" placeholder="Full Name" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100"><span class="lnr lnr-text-align-left"></span></span>
					</div>

					<!-- Email -->
				<div class="wrap-input100 m-b-16">
    <input class="input100" type="email" th:field="*{email}" placeholder="Email Address" required>
    <span class="focus-input100"></span>
    <span class="symbol-input100"><span class="lnr lnr-envelope"></span></span>

    <div th:if="${#fields.hasErrors('email')}" class="text-danger">
        <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
    </div>
</div>


					<!-- Phone -->
					<div class="wrap-input100 m-b-16">
						<input class="input100" type="text" th:field="*{phone}" placeholder="Phone Number">
						<span class="focus-input100"></span>
						<span class="symbol-input100"><span class="lnr lnr-phone-handset"></span></span>
					</div>

					<!-- Gender -->
					<div class="m-b-16 text-left">
						<label class="radio-inline m-r-20">
							<input type="radio" th:field="*{gender}" value="Male"> Male
						</label>
						<label class="radio-inline">
							<input type="radio" th:field="*{gender}" value="Female"> Female
						</label>
					</div>

					<!-- Date of Birth -->
					<div class="wrap-input100 m-b-16">
						<input class="input100" type="date" th:field="*{dateOfBirth}">
						<span class="focus-input100"></span>
						<span class="symbol-input100"><span class="lnr lnr-calendar-full"></span></span>
					</div>

					<!-- Password -->
					<div class="wrap-input100 validate-input m-b-16" data-validate="Password is required">
						<input class="input100" type="password" id="password" th:field="*{passwordHash}" placeholder="Password" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100"><span class="lnr lnr-lock"></span></span>
						<span class="btn-show-pass"><i class="fa fa-eye"></i></span>
					</div>

					<!-- Confirm Password -->
					<div class="wrap-input100 validate-input m-b-16" data-validate="Please confirm your password">
						<input class="input100" type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
						<span class="focus-input100"></span>
						<span class="symbol-input100"><span class="lnr lnr-lock"></span></span>
						<span class="btn-show-pass"><i class="fa fa-eye"></i></span>
					</div>

					<!-- Error Message -->
					<div id="passwordError" class="text-danger m-b-16" style="display:none;">
						Passwords do not match!
					</div>

					<div class="container-login100-form-btn p-t-15">
						<button type="submit" class="login100-form-btn" onclick="return validatePasswords();">
							Register
						</button>
					</div>

					<div class="text-center w-full p-t-30">
						<span class="txt1">Already have an account?</span>
						<a class="txt1 bo1 hov1" th:href="@{/showMyLoginPage}">
							Log-in
						</a>
					</div>

				</form>
			</div>
		</div>
	</div>
	
	<script src="login/vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="login/vendor/bootstrap/js/popper.js"></script>
	<script src="login/vendor/bootstrap/js/bootstrap.min.js"></script>
	<script src="login/vendor/select2/select2.min.js"></script>
	<script src="login/js/main.js"></script>

	<script>
		// Toggle show/hide password
		$(".btn-show-pass").on("click", function(){
			let input = $(this).siblings("input");
			if(input.attr("type") === "password"){
				input.attr("type", "text");
				$(this).find("i").removeClass("fa-eye").addClass("fa-eye-slash");
			} else {
				input.attr("type", "password");
				$(this).find("i").removeClass("fa-eye-slash").addClass("fa-eye");
			}
		});

		// Validate confirm password
		function validatePasswords(){
			let pass = document.getElementById("password").value;
			let confirm = document.getElementById("confirmPassword").value;
			if(pass !== confirm){
				document.getElementById("passwordError").style.display = "block";
				return false;
			}
			return true;
		}

	</script>
</body>
</html>

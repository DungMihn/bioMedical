<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
    <head>
        <meta charset="UTF-8">
        <title>Account - Remedic</title>

        <!-- Linearicons (đã dùng trong dự án) -->
        <link rel="stylesheet" type="text/css" href="/login/fonts/Linearicons-Free-v1.0.0/icon-font.min.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.css">

        <style>
            body.account-page-body {
                background:#f5f6fa;
                font-family:'Segoe UI', Roboto, sans-serif;
                color:#333;
            }

            /* Sidebar */
            .account-page-sidebar {
                background:#fff;
                border-radius:12px;
                padding:25px 20px;
                box-shadow:0 4px 12px rgba(0,0,0,.06);
            }
            .account-page-sidebar h5 {
                font-weight:600;
                margin-bottom:10px;
            }
            .account-page-sidebar .list-group-item {
                border:none;
                border-radius:8px;
                margin-bottom:10px;
                transition:.2s;
                font-weight:500;
                color:#333;
                text-align:left;
            }
            .account-page-sidebar .list-group-item span.lnr {
                width:22px;
            }
            .account-page-sidebar .list-group-item:hover {
                background:#e9f3ff;
                color:#007bff;
            }
            .account-page-sidebar .list-group-item.active {
                background:#007bff!important;
                color:#fff!important;
            }

            /* Logout Button */
            .account-page-logout {
                display:block;
                width:100%;
                margin-top:20px;
                border-radius:10px;
                background:#fff3f3;
                color:#d9534f;
                font-weight:600;
                padding:10px 0;
                border:1px solid #f1b4b4;
                transition:.2s;
            }
            .account-page-logout:hover {
                background:#d9534f;
                color:#fff;
            }

            /* Cards & Filters */
            .account-page-card {
                background:#fff;
                border-radius:10px;
                padding:20px;
                box-shadow:0 2px 10px rgba(0,0,0,.05);
                margin-bottom:20px;
            }
            .account-page-filter {
                background:#fff;
                border-radius:10px;
                padding:15px 20px;
                margin-bottom:15px;
                box-shadow:0 2px 8px rgba(0,0,0,.05);
            }
            .account-page-filter h4 {
                font-weight:700;
                color:#007bff;
            }

            /* Date inputs: small placeholder + calendar icon (no markup change) */
            .datepicker{
                position:relative;
                background:
                    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23909cab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>')
                    no-repeat right 10px center;
                background-size:18px;
                padding-right:34px;
                border-radius:8px;
                height:38px;
                font-size:14px;
            }
            .datepicker::placeholder{
                color:#a9b3c1;
                font-size:13px;
            }

            /* Filter chips (All/Pending/...) – small radius, uniform sizing & spacing */
            .account-page-btn-group{
                display:flex;
                flex-wrap:wrap;
                gap:10px;
            }
            .account-page-btn-group .btn{
                border-radius:12px;             /* bo tròn ít lại */
                padding:6px 16px;
                min-width:120px;                /* dàn ngang đều tay */
                height:38px;                    /* cùng chiều cao với ô date */
                display:inline-flex;
                align-items:center;
                justify-content:center;
                font-weight:600;
            }

            /* Profile form (dùng bên fragment profile) */
            .account-page-profile{
                background:#fff;
                border-radius:10px;
                padding:25px;
                box-shadow:0 2px 10px rgba(0,0,0,.05);
            }
            .account-page-profile input,.account-page-profile select{
                border-radius:8px;
            }
            .account-page-profile .btn-primary{
                border-radius:8px;
                background:linear-gradient(90deg,#007bff,#00bfa5);
                border:none;
            }
            .account-page-profile .btn-primary:hover{
                background:linear-gradient(90deg,#006ae0,#00a58d);
            }
            input[readonly], input:disabled{
                background-color:#f7f7f7!important;
                cursor:not-allowed;
            }

            /* === Fix Filter button color === */
            #btnFilterDate {
                background-color: #007bff;   /* xanh cơ bản */
                color: #fff;
                border: none;
                transition: background-color 0.2s ease;
            }

            #btnFilterDate:hover {
                background-color: #0069d9;   /* xanh đậm hơn khi hover */
                color: #fff;                 /* chữ vẫn trắng rõ ràng */
            }

            #btnFilterDate:active {
                background-color: #0056b3;   /* nhấn giữ thì xanh đậm hơn */
                color: #fff;
            }

            /* Icon lịch nằm ở cuối input */
            .calendar-icon-right {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: #909cab;
                pointer-events: none;
                font-size: 16px;
            }

            /* Chừa khoảng trống bên phải input cho icon */
            .datepicker {
                padding-right: 32px !important;
            }

            #btnLoadMore {
                border-radius: 8px;
                font-weight: 600;
                transition: all 0.2s ease;
            }
            #btnLoadMore:hover {
                background-color: #007bff;
                color: #fff;
            }


        </style>
    </head>

    <body class="account-page-body">

        <section layout:fragment="content">
            <div class="account-wrapper py-3">
                <div class="container">
                    <div class="row">

                        <!-- Sidebar -->
                        <div class="col-md-3 mb-4">
                            <div class="account-page-sidebar text-center">
                                <span class="lnr lnr-user" style="font-size:48px;color:#6c757d;margin-bottom:10px;"></span>
                                <h5 th:text="${user.fullName}">User Name</h5>
                                <p class="text-muted mb-4" style="font-size:14px;">Member Account</p>

                                <div class="list-group">
                                    <button id="btnHistory" class="list-group-item list-group-item-action active">
                                        <span class="lnr lnr-history mr-2"></span> Appointment History
                                    </button>
                                    <button id="btnProfile" class="list-group-item list-group-item-action">
                                        <span class="lnr lnr-pencil mr-2"></span> Personal Information
                                    </button>
                                </div>

                                <a href="/logout" class="account-page-logout text-center">
                                    <span class="lnr lnr-exit mr-2"></span> Logout
                                </a>
                            </div>
                        </div>

                        <!-- Main content -->
                        <div class="col-md-9">

                            <!-- TAB 1: APPOINTMENT HISTORY -->
                            <div id="tabHistory">
                                <div class="account-page-filter d-flex justify-content-between align-items-center flex-wrap">
                                    <h4><span class="lnr lnr-calendar-full mr-2"></span><b>Appointment History</b></h4>

                                    <div class="d-flex align-items-center flex-wrap mb-2">
                                        <label class="mr-2 mb-0">From:</label>
                                        <div class="position-relative mr-2" style="width:150px;">
                                            <input type="text" id="fromDate" class="form-control datepicker pr-4" placeholder="Select start date">
                                            <span class="lnr lnr-calendar-full calendar-icon-right"></span>
                                        </div>

                                        <label class="mr-2 mb-0">To:</label>
                                        <div class="position-relative mr-2" style="width:150px;">
                                            <input type="text" id="toDate" class="form-control datepicker pr-4" placeholder="Select end date">
                                            <span class="lnr lnr-calendar-full calendar-icon-right"></span>
                                        </div>

                                        <button id="btnFilterDate" class="btn btn-primary text-white d-inline-flex align-items-center" style="height:38px;">
                                            <span class="lnr lnr-funnel mr-1"></span> Filter
                                        </button>
                                    </div>
                                </div>


                                <div class="account-page-btn-group mb-3">
                                    <button type="button" class="btn btn-outline-primary filter-btn active" data-status="ALL">All</button>
                                    <button type="button" class="btn btn-outline-warning filter-btn" data-status="PENDING">Pending</button>
                                    <button type="button" class="btn btn-outline-info filter-btn" data-status="CONFIRMED">Confirmed</button>
                                    <button type="button" class="btn btn-outline-success filter-btn" data-status="COMPLETED">Completed</button>
                                    <button type="button" class="btn btn-outline-danger filter-btn" data-status="CANCELLED">Cancelled</button>
                                </div>

                                <div id="appointmentList">
                                    <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info">
                                        You don't have any appointments yet.
                                    </div>

                                    <!-- GIỮ NGUYÊN LOGIC VÒNG LẶP -->
                                    <div th:each="a : ${appointments}"
                                         class="account-page-card appointment-item"
                                         th:attr="data-status=${a.status}, data-created=${#dates.format(a.createdAt,'yyyy-MM-dd')}">

                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h5>
                                                <span class="lnr lnr-apartment mr-2 text-primary"></span>
                                                <span th:text="${a.slotId.clinicId.name}">Clinic Name</span>
                                            </h5>
                                            <span class="badge px-3 py-2"
                                                  th:text="${a.status}"
                                                  th:classappend="
                                                  ${a.status == 'COMPLETED'} ? ' badge-success' :
                                                  (${a.status == 'PENDING'} ? ' badge-warning text-dark' :
                                                  (${a.status == 'CONFIRMED'} ? ' badge-info' :
                                                  (${a.status == 'CANCELLED'} ? ' badge-danger' : 'badge-secondary')))
                                                  ">
                                            </span>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-8">
                                                <p><b>Doctor:</b> <span th:text="${a.slotId.doctorId.userId.fullName}">Dr. Nguyen Van A</span></p>
                                                <p><b>Date:</b> <span th:text="${#dates.format(a.slotId.slotDate,'dd/MM/yyyy')}"></span></p>
                                                <p><b>Time:</b> <span th:text="${#dates.format(a.slotId.slotTime,'HH:mm')}"></span></p>
                                                <p><b>Notes:</b> <span th:text="${a.notes}">None</span></p>
                                            </div>
                                            <div class="col-md-4 text-right">
                                                <p><b>Created on:</b> <span th:text="${#dates.format(a.createdAt,'dd/MM/yyyy')}"></span></p>
                                                <p class="text-muted small">(Appointment ID: <span th:text="${a.appointmentId}"></span>)</p>

                                                <!-- Detail button -->
                                                <a href="#"
                                                   class="btn btn-outline-primary btn-sm mt-2 view-detail"
                                                   th:if="${a.status == 'COMPLETED'}"
                                                   th:attr="data-id=${a.appointmentId}">
                                                    <span class="lnr lnr-license mr-1"></span> View Details
                                                </a>

                                                <!-- Confirm appointment button -->
                                                <button class="btn btn-outline-success btn-sm mt-2 confirm-appointment"
                                                        th:if="${a.status == 'PENDING'}"
                                                        th:attr="data-email=${a.userId.email}">
                                                    <span class="lnr lnr-checkmark-circle mr-1"></span> Confirm
                                                </button>

                                                <!-- Cancel button -->
                                                <button class="btn btn-outline-danger btn-sm mt-2 cancel-appointment"
                                                        th:if="${a.status == 'PENDING'}"
                                                        th:attr="data-id=${a.appointmentId}">
                                                    <span class="lnr lnr-cross-circle mr-1"></span> Cancel
                                                </button>
                                            </div>
                                        </div>

                                    </div><!-- /each appointment -->
                                </div>
                                <!-- ✅ Nút xem thêm -->
                                <div class="text-center mt-3" id="loadMoreWrapper" style="display:none;">
                                    <button id="btnLoadMore" class="btn btn-outline-primary px-4">
                                        Load more <span id="remainingCount"></span>
                                    </button>
                                </div>
                            </div>


                            <!-- TAB 2: PERSONAL INFO (đưa sang fragment) -->
                            <th:block th:replace="fragments/account-profile :: profileTab"></th:block>

                        </div>
                    </div>
                </div>
            </div>
        </section>

    <th:block layout:fragment="global-modal" th:replace="fragments/account-modal :: recordModal"></th:block>
    <th:block layout:fragment="extra-scripts" th:replace="fragments/account-scripts :: accountScripts"></th:block>

</body>
</html>

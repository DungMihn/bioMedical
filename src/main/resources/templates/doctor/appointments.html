<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/doctor/dashboard}">Dashboard</a>
                <a class="nav-link active" th:href="@{/doctor/appointments}">Appointments</a>
                <a class="nav-link" th:href="@{/doctor/medical-records}">Medical Records</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h2>Appointment Management</h2>
                
                <div class="card">
                    <div class="card-header">
                        <h5>All Appointments</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(todayAppointments)}" class="text-center">
                            <p>No appointments found</p>
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(todayAppointments)}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Patient</th>
                                        <th>Date & Time</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="appointment : ${appointments}">
                                        <td>
                                            <strong th:text="${appointment.patientName}"></strong><br>
                                            <small th:text="${appointment.patientEmail}"></small>
                                        </td>
                                        <td>
                                            <span th:text="${appointment.appointmentDate}"></span><br>
                                            <small th:text="${appointment.appointmentTime}"></small>
                                        </td>
                                        <td>
                                            <span th:class="${'badge ' + 
                                                (appointment.status == 'CONFIRMED' ? 'bg-success' : 
                                                 appointment.status == 'PENDING' ? 'bg-warning' : 
                                                 appointment.status == 'CANCELLED' ? 'bg-danger' : 
                                                 appointment.status == 'COMPLETED' ? 'bg-info' : 'bg-secondary')}"
                                                th:text="${appointment.status}">
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-group">
                                                <a th:href="@{/doctor/appointment/{id}(id=${appointment.appointmentId})}" 
                                                   class="btn btn-info btn-sm">
                                                    <i class="fas fa-eye"></i> View
                                                </a>
                                                <button th:if="${appointment.status == 'PENDING'}" 
                                                        class="btn btn-success btn-sm" 
                                                        th:onclick="'confirmAppointment(' + ${appointment.appointmentId} + ')'">
                                                    <i class="fas fa-check"></i> Confirm
                                                </button>
                                                <button th:if="${appointment.status == 'PENDING' || appointment.status == 'CONFIRMED'}" 
                                                        class="btn btn-danger btn-sm" 
                                                        th:onclick="'cancelAppointment(' + ${appointment.appointmentId} + ')'">
                                                    <i class="fas fa-times"></i> Cancel
                                                </button>
                                                <button th:if="${appointment.status == 'CONFIRMED'}" 
                                                        class="btn btn-primary btn-sm" 
                                                        th:onclick="'completeAppointment(' + ${appointment.appointmentId} + ')'">
                                                    <i class="fas fa-check-circle"></i> Complete
                                                </button>
                                                <a th:if="${appointment.status == 'COMPLETED'}" 
                                                   th:href="@{/doctor/medical-record/create?appointmentId={id}(id=${appointment.appointmentId})}" 
                                                   class="btn btn-warning btn-sm">
                                                    <i class="fas fa-file-medical"></i> Create Record
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function confirmAppointment(appointmentId) {
        if (confirm('Are you sure you want to confirm this appointment?')) {
            updateAppointmentStatus(appointmentId, 'confirm');
        }
    }
    
    function cancelAppointment(appointmentId) {
        if (confirm('Are you sure you want to cancel this appointment?')) {
            updateAppointmentStatus(appointmentId, 'cancel');
        }
    }
    
    function completeAppointment(appointmentId) {
        if (confirm('Are you sure you want to mark this appointment as completed?')) {
            updateAppointmentStatus(appointmentId, 'complete');
        }
    }
    
    function updateAppointmentStatus(appointmentId, action) {
        const url = `/doctor/appointment/${appointmentId}/${action}`;
        
        fetch(url, {
            method: 'POST',
            credentials: 'include'
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Error updating appointment status');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error updating appointment status');
        });
    }
    </script>
</body>
</html>

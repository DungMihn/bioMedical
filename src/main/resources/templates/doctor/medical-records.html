<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/doctor/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/doctor/appointments}">Appointments</a>
                <a class="nav-link active" th:href="@{/doctor/medical-records}">Medical Records</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h2>Medical Records</h2>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Search Records</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/doctor/medical-records}" method="get">
                            <div class="input-group">
                                <input type="text" class="form-control" name="search" 
                                       th:value="${search}" placeholder="Search by patient name or phone number">
                                <button class="btn btn-primary" type="submit">
                                    <i class="fas fa-search"></i> Search
                                </button>
                                <a th:href="@{/doctor/medical-records}" class="btn btn-secondary">
                                    <i class="fas fa-sync"></i> Clear
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>Medical Records</h5>
                    </div>
                    <div class="card-body"> 
                        <div th:if="${#lists.isEmpty(records)}" class="text-center">
                            <p th:if="${search}" th:text="'No records found for: ' + ${search}"></p>
                            <p th:unless="${search}">No medical records found</p>
                        </div>
                        
                        <div th:unless="${#lists.isEmpty(records)}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Patient</th>
                                        <th>Date</th>
                                        <th>Diagnosis</th>
                                        <th>Medications</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="record : ${records}">
                                        <td>
                                            <strong th:text="${record.patient.fullName}"></strong><br>
                                            <small th:text="${record.patient.phone}"></small>
                                        </td>
                                        <td th:text="${#dates.format(record.createdAt, 'dd/MM/yyyy')}"></td>
                                        <td>
                                            <span th:if="${record.diagnosis}" th:text="${record.diagnosis}"></span>
                                            <span th:unless="${record.diagnosis}" class="text-muted">No diagnosis</span>
                                        </td>
                                        <td>
                                            
                                            <span th:if="${#lists.isEmpty(record.prescriptions)}" class="text-muted">No medications</span>
                                            <div th:unless="${#lists.isEmpty(record.prescriptions)}">
                                                <span th:each="med, stat : ${record.prescriptions}" 
                                                      th:text="${med.medicationName} + (${stat.last} ? '' : ', ')"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <a th:href="@{/doctor/medical-record/{id}(id=${record.recordId})}" 
                                               class="btn btn-info btn-sm">
                                                <i class="fas fa-eye"></i> View
                                            </a>
                                            <a th:href="@{/doctor/medical-record/edit/{id}(id=${record.recordId})}" 
                                               class="btn btn-warning btn-sm">
                                                <i class="fas fa-edit"></i> Edit
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

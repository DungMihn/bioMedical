<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Hồ sơ Bệnh án</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Chỉnh sửa Hồ sơ Bệnh án</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/doctor/medical-record/update}" method="post">
                <input type="hidden" th:field="${medicalRecord.recordId}">

                <!-- Thông tin chẩn đoán -->
                <div class="mb-4">
                    <h5>Thông tin chẩn đoán và điều trị</h5>
                    <div class="mb-3">
                        <label class="form-label">Triệu chứng</label>
                        <textarea class="form-control" th:field="${medicalRecord.symptoms}" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Chẩn đoán</label>
                        <textarea class="form-control" th:field="${medicalRecord.diagnosis}" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phương pháp điều trị</label>
                        <textarea class="form-control" th:field="${medicalRecord.treatment}" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ghi chú thêm</label>
                        <textarea class="form-control" th:field="${medicalRecord.notes}" rows="2"></textarea>
                    </div>
                </div>

                <!-- Đơn thuốc -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5>Đơn thuốc</h5>
                        <button type="button" class="btn btn-sm btn-success" onclick="addPrescriptionRow()">
                            <i class="fas fa-plus me-1"></i>Thêm thuốc
                        </button>
                    </div>

                    <div id="prescriptions-container">
                        <div th:each="prescription, iter : ${prescriptions}" class="prescription-row mb-3 p-3 border rounded">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <label class="form-label">Tên thuốc</label>
                                    <input type="text" class="form-control"
                                           th:name="medicationNames"
                                           th:value="${prescription.medicationName}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Liều dùng</label>
                                    <input type="text" class="form-control"
                                           th:name="dosages"
                                           th:value="${prescription.dosage}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Tần suất</label>
                                    <input type="text" class="form-control"
                                           th:name="frequencies"
                                           th:value="${prescription.frequency}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Thời gian</label>
                                    <input type="text" class="form-control"
                                           th:name="durations"
                                           th:value="${prescription.duration}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Ghi chú</label>
                                    <input type="text" class="form-control"
                                           th:name="notes"
                                           th:value="${prescription.notes}">
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-danger mt-2" onclick="removePrescriptionRow(this)">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Nút hành động -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Lưu thay đổi
                    </button>
                    <a th:href="@{'/doctor/medical-record/' + ${medicalRecord.recordId}}"
                       class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function addPrescriptionRow() {
        const container = document.getElementById('prescriptions-container');
        const newRow = document.createElement('div');
        newRow.className = 'prescription-row mb-3 p-3 border rounded';
        newRow.innerHTML = `
            <div class="row g-2">
                <div class="col-md-4">
                    <label class="form-label">Tên thuốc</label>
                    <input type="text" class="form-control" name="medicationNames" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Liều dùng</label>
                    <input type="text" class="form-control" name="dosages">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tần suất</label>
                    <input type="text" class="form-control" name="frequencies">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Thời gian</label>
                    <input type="text" class="form-control" name="durations">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Ghi chú</label>
                    <input type="text" class="form-control" name="notes">
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-danger mt-2" onclick="removePrescriptionRow(this)">
                <i class="fas fa-trash"></i> Xóa
            </button>
        `;
        container.appendChild(newRow);
    }

    function removePrescriptionRow(button) {
        button.closest('.prescription-row').remove();
    }
</script>
</body>
</html>

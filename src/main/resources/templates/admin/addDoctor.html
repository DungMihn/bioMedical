                                                            <!-- Area Chart Example
                                                            <div class="card mb-3">
                                                              <div class="card-header">
                                                                <i class="fas fa-chart-area"></i>

                                                            <!-- DataTables Example -->


                                                            <div>

                                                                <form th:action="@{/admin/save-doctor}" th:object="${doctorForm}" method="post" 
                                                                      class="p-4 border rounded bg-light shadow-sm">

                                                                    <!-- USER fields -->
                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Username</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="text" th:field="*{username}" class="form-control" required placeholder="Enter username">
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Password</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="password" th:field="*{passwordHash}" class="form-control" required placeholder="Enter password">
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Email</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email">
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Phone</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="text" th:field="*{phone}" class="form-control" placeholder="Enter phone number">
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Full Name</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Enter full name">
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Gender</label>
                                                                        <div class="col-sm-9">
                                                                            <select th:field="*{gender}" class="form-select">
                                                                                <option value="">-- Select Gender --</option>
                                                                                <option value="Male">Male</option>
                                                                                <option value="Female">Female</option>
                                                                                <option value="Other">Other</option>
                                                                            </select>
                                                                        </div>
                                                                    </div>

                                                                    <div class="mb-3 row">
                                                                        <label class="col-sm-3 col-form-label">Date of Birth</label>
                                                                        <div class="col-sm-9">
                                                                            <input type="date" th:field="*{dateOfBirth}" class="form-control">
                                                                        </div>
                                                                    </div>

                                                                    <!-- hidden role = DOCTOR -->
                                                                    <input type="hidden" th:field="*{role}" value="DOCTOR">

                                                                        <hr class="my-4">

                                                                            <!-- DOCTOR fields -->
                                                                            <div class="mb-3 row">
                                                                                <label class="col-sm-3 col-form-label">Clinic</label>
                                                                                <div class="col-sm-9">
                                                                                    <select th:field="*{clinicId}" class="form-select">
                                                                                        <option th:each="c : ${clinics}" th:value="${c.clinicId}" th:text="${c.name}"></option>
                                                                                    </select>
                                                                                </div>
                                                                            </div>

                                                                            <div class="mb-3 row">
                                                                                <label class="col-sm-3 col-form-label">Specialty</label>
                                                                                <div class="col-sm-9">
                                                                                    <select th:field="*{specialtyId}" class="form-select">
                                                                                        <option th:each="s : ${specialties}" th:value="${s.specialtyId}" th:text="${s.name}"></option>
                                                                                    </select>
                                                                                </div>
                                                                            </div>

                                                                            <div class="mb-3 row">
                                                                                <label class="col-sm-3 col-form-label">Bio</label>
                                                                                <div class="col-sm-9">
                                                                                    <textarea th:field="*{bio}" class="form-control" rows="3" placeholder="Enter biography"></textarea>
                                                                                </div>
                                                                            </div>

                                                                            <!-- Submit -->
                                                                            <div class="text-center">
                                                                                <button type="submit" class="btn btn-primary btn-lg px-5">Save Doctor</button>
                                                                            </div>
                                                                            </form>


                                                                            </div>

                                                                                                <span aria-hidden="true">×</span>
                                                                                            </button>
                                                                                        </div>
                                                                                        <div class="modal-body">Select "Logout" below if you are ready to end your current session.</div>
                                                                                        <div class="modal-footer">
                                                                                            <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>

                                                                                                <button type="submit" class="btn btn-success">Logout</button>   </form>
                                                                                        </div>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Login</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- (Tùy chọn) Meta CSRF nếu bạn gọi AJAX -->
        <meta name="_csrf" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:content="${_csrf.headerName}" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" th:href="@{/login/images/icons/favicon.ico}" />

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/login/vendor/bootstrap/css/bootstrap.min.css}" />
        <link rel="stylesheet" th:href="@{/login/fonts/font-awesome-4.7.0/css/font-awesome.min.css}" />
        <link rel="stylesheet" th:href="@{/login/fonts/Linearicons-Free-v1.0.0/icon-font.min.css}" />
        <link rel="stylesheet" th:href="@{/login/vendor/animate/animate.css}" />
        <link rel="stylesheet" th:href="@{/login/vendor/css-hamburgers/hamburgers.min.css}" />
        <link rel="stylesheet" th:href="@{/login/vendor/select2/select2.min.css}" />
        <link rel="stylesheet" th:href="@{/login/css/util.css}" />
        <link rel="stylesheet" th:href="@{/login/css/main.css}" />
    </head>
    <body>

        <div class="limiter">
            <div class="container-login100">
                <div class="wrap-login100 p-l-50 p-r-50 p-t-77 p-b-30">

                    <!-- LƯU Ý: phải có hidden CSRF -->
                    <form class="login100-form validate-form"
                          th:action="@{/authenticateTheUser}" method="POST">

                        <!-- CSRF token bắt buộc cho POST khi bật CSRF -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <span class="login100-form-title p-b-55"> User, Doctor &amp; Admin Login </span>



                        <div class="wrap-input100 validate-input m-b-16"
                             data-validate="Valid email is required: ex@abc.xyz">
                            <input class="input100" type="text" name="username" placeholder="Username or Email" />
                            <span class="focus-input100"></span>
                            <span class="symbol-input100">
                                <span class="lnr lnr-envelope"></span>
                            </span>
                        </div>

                        <div class="wrap-input100 validate-input m-b-16" data-validate="Password is required">
                            <input class="input100" type="password" name="password" placeholder="Password" />
                            <span class="focus-input100"></span>
                            <span class="symbol-input100">
                                <span class="lnr lnr-lock"></span>
                            </span>
                        </div>

                        <div class="container-login100-form-btn p-t-25">
                            <button class="login100-form-btn" type="submit">Login</button>
                        </div>

                        <!-- Thông báo lỗi/đăng xuất -->
                        <div th:if="${param.error}" class="text-center w-full p-t-42 p-b-22">
                            <span class="alart">Wrong password / username</span>
                        </div>

                        <div th:if="${param.logout}" class="text-center w-full p-t-42 p-b-22">
                            <span class="alart">You have logged out successfully</span>
                        </div>
                    </form>

                    <div class="text-center w-full p-t-115"></div>

                    <div class="text-center w-full p-t-115">
                        <span class="txt1">Not a member?</span>
                        <a class="txt1 bo1 hov1" th:href="@{/register}">Sign up now</a>
                    </div>

                </div>
            </div>
        </div>

        <!-- JS -->
        <script th:src="@{/login/vendor/jquery/jquery-3.2.1.min.js}"></script>
        <script th:src="@{/login/vendor/bootstrap/js/popper.js}"></script>
        <script th:src="@{/login/vendor/bootstrap/js/bootstrap.min.js}"></script>
        <script th:src="@{/login/vendor/select2/select2.min.js}"></script>
        <script th:src="@{/login/js/main.js}"></script>

    </body>
</html>

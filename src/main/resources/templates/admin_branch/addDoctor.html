<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Admin Branch - Add Doctor</title>
  <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="../vendor/datatables/dataTables.bootstrap4.css" rel="stylesheet">
  <link href="../vendor/css/sb-admin.css" rel="stylesheet">
</head>
<body id="page-top">
<nav class="navbar navbar-expand navbar-dark bg-dark static-top">
  <!-- đổi brand link về route nhánh -->
  <a class="navbar-brand mr-1" th:href="@{/admin-branch/doctor-details}">Doctor+ Admin Branch</a>
  <button class="btn btn-link btn-sm text-white order-1 order-sm-0" id="sidebarToggle"><i class="fas fa-bars"></i></button>
  <ul class="navbar-nav ml-auto ml-md-0">
    <li class="nav-item dropdown no-arrow">
      <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-user-circle fa-fw"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post">
          <button class="dropdown-item" type="submit">Logout</button>
        </form>
      </div>
    </li>
  </ul>
</nav>

<div id="wrapper">
  <!-- Sidebar chỉ dùng route /admin-branch/... -->
  <ul class="sidebar navbar-nav">
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin-branch/appointments}">
        <i class="fas fa-fw fa-calendar"></i><span>Appointments</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin-branch/doctor-details}">
        <i class="fas fa-fw fa-user-md"></i><span>Doctor Details</span>
      </a>
    </li>
    <li class="nav-item active">
      <a class="nav-link" th:href="@{/admin-branch/add-doctor}">
        <i class="fas fa-fw fa-plus"></i><span>Add Doctor</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin-branch/edit-my-profile}">
        <i class="fas fa-fw fa-user"></i><span>My Profile</span>
      </a>
    </li>
  </ul>

  <div id="content-wrapper">
    <div class="container-fluid">

      <form th:action="@{/admin-branch/save-doctor}" th:object="${doctorForm}" method="post"
            class="p-4 border rounded bg-light shadow-sm">
        <!-- user fields -->
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Username</label>
          <div class="col-sm-9"><input type="text" th:field="*{username}" class="form-control" required></div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Password</label>
          <div class="col-sm-9"><input type="password" th:field="*{passwordHash}" class="form-control" required></div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9"><input type="email" th:field="*{email}" class="form-control"></div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Phone</label>
          <div class="col-sm-9"><input type="text" th:field="*{phone}" class="form-control"></div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Full Name</label>
          <div class="col-sm-9"><input type="text" th:field="*{fullName}" class="form-control"></div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Gender</label>
          <div class="col-sm-9">
            <select th:field="*{gender}" class="form-select">
              <option value="">-- Select Gender --</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Date of Birth</label>
          <div class="col-sm-9"><input type="date" th:field="*{dateOfBirth}" class="form-control"></div>
        </div>

        <hr class="my-4">
        <!-- doctor fields -->
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Clinic</label>
          <div class="col-sm-9">
            <select th:field="*{clinicId}" class="form-select">
              <option th:each="c : ${clinics}" th:value="${c.clinicId}" th:text="${c.name}"></option>
            </select>
          </div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Specialty</label>
          <div class="col-sm-9">
            <select th:field="*{specialtyId}" class="form-select">
              <option th:each="s : ${specialties}" th:value="${s.specialtyId}" th:text="${s.name}"></option>
            </select>
          </div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-3 col-form-label">Bio</label>
          <div class="col-sm-9"><textarea th:field="*{bio}" class="form-control" rows="3"></textarea></div>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-lg px-5">Save Doctor</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="../vendor/chart.js/Chart.min.js"></script>
<script src="../vendor/datatables/jquery.dataTables.js"></script>
<script src="../vendor/datatables/dataTables.bootstrap4.js"></script>
<script src="../vendor/js/sb-admin.min.js"></script>
<script src="../vendor/js/demo/datatables-demo.js"></script>
<script src="../vendor/js/demo/chart-area-demo.js"></script>
</body>
</html>

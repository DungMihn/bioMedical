<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Invoice Form - Admin Branch</title>

  <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
  <link th:href="@{/vendor/css/sb-admin.css}" rel="stylesheet">
  <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
</head>
<body id="page-top">

<nav class="navbar navbar-expand navbar-dark bg-gradient-theme static-top">
  <a class="navbar-brand mr-1" href="#" th:text="'Doctor+ Admin Branch'">Doctor+ Admin Branch</a>
</nav>

<div id="wrapper">
  <ul class="sidebar navbar-nav">
    <li class="nav-item">
      <a class="nav-link" th:href="@{/admin-branch/invoices}">
        <i class="fas fa-file-invoice-dollar"></i> <span>Invoices</span>
      </a>
    </li>
  </ul>

  <div id="content-wrapper">
    <div class="container-fluid">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin-branch/invoices}">Invoices</a></li>
        <li class="breadcrumb-item active">Form</li>
      </ol>

      <div class="card mb-3">
        <div class="card-header">
          <i class="fas fa-edit"></i> Hóa đơn (Draft)
        </div>
        <div class="card-body">
          <form th:action="@{/admin-branch/invoices/save}" th:object="${invoice}" method="post" class="needs-validation">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{invoiceId}" />

            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Số HĐ</label>
                <input class="form-control" th:field="*{invoiceNo}" placeholder="(tự phát hành khi Issue)">
              </div>
              <div class="col-md-4 mb-3">
                <label>Ngày hóa đơn</label>
                <input class="form-control" th:value="${#temporals.format(invoice.invoiceDate,'dd/MM/yyyy HH:mm')}" readonly>
              </div>
              <div class="col-md-4 mb-3">
                <label>Trạng thái</label>
                <input class="form-control" th:value="${invoice.status}" readonly>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Chi nhánh</label>
                <input class="form-control" th:value="${invoice.clinic != null ? invoice.clinic.name : '—'}" readonly>
              </div>
              <div class="col-md-6 mb-3">
                <label>Bệnh nhân</label>
                <input class="form-control" th:value="${invoice.patient != null ? invoice.patient.fullName : '—'}" readonly>
              </div>
            </div>

            <hr/>

            <div class="row">
              <div class="col-md-3 mb-3">
                <label>Subtotal</label>
                <input class="form-control money" th:field="*{subtotal}" id="subtotal" value="0">
              </div>
              <div class="col-md-3 mb-3">
                <label>Giảm giá</label>
                <input class="form-control money" th:field="*{discount}" id="discount" value="0">
              </div>
              <div class="col-md-3 mb-3">
                <label>Thuế</label>
                <input class="form-control money" th:field="*{taxAmount}" id="taxAmount" value="0">
              </div>
              <div class="col-md-3 mb-3">
                <label>Tổng cộng</label>
                <input class="form-control" id="totalAmount" readonly
                       th:value="${#numbers.formatDecimal(invoice.totalAmount,0,'POINT',2,'COMMA')}">
              </div>
            </div>

            <div class="text-center">
              <button class="btn btn-primary px-5" type="submit">
                <i class="fas fa-save"></i> Lưu Draft
              </button>
              <a class="btn btn-secondary px-4 ml-2" th:href="@{/admin-branch/invoices}">
                Hủy
              </a>
            </div>
          </form>

          <div class="alert alert-info mt-3">
            <i class="fas fa-info-circle"></i>
            Sau khi Lưu Draft, vào trang chi tiết để thêm dòng hàng (Items) và thu tiền (Payments), rồi bấm <b>Issue</b>.
          </div>

        </div>
        <div class="card-footer small text-muted">Doctor+</div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
  function toNumber(v){ return isNaN(parseFloat(v)) ? 0 : parseFloat(v); }
  function recalc(){
    const subtotal = toNumber(document.getElementById('subtotal').value);
    const discount = toNumber(document.getElementById('discount').value);
    const tax      = toNumber(document.getElementById('taxAmount').value);
    const total    = subtotal - discount + tax;
    document.getElementById('totalAmount').value = total.toFixed(2);
  }
  ['subtotal','discount','taxAmount'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', recalc);
  });
  recalc();
</script>
</body>
</html>

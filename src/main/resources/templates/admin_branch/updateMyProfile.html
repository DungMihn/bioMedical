<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Admin Branch - My Profile</title>
  <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="../vendor/datatables/dataTables.bootstrap4.css" rel="stylesheet">
  <link href="../vendor/css/sb-admin.css" rel="stylesheet">
</head>
<body id="page-top">
<nav class="navbar navbar-expand navbar-dark bg-dark static-top">
  <a class="navbar-brand mr-1" th:href="@{/admin-branch/doctor-details}">Doctor+ Admin Branch</a>
  <button class="btn btn-link btn-sm text-white" id="sidebarToggle"><i class="fas fa-bars"></i></button>
  <ul class="navbar-nav ml-auto ml-md-0">
    <li class="nav-item dropdown no-arrow">
      <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-user-circle fa-fw"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right">
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post"><button class="dropdown-item" type="submit">Logout</button></form>
      </div>
    </li>
  </ul>
</nav>

<div id="wrapper">
  <ul class="sidebar navbar-nav">
    <li class="nav-item"><a class="nav-link" th:href="@{/admin-branch/appointments}"><i class="fas fa-fw fa-calendar"></i><span>Appointments</span></a></li>
    <li class="nav-item"><a class="nav-link" th:href="@{/admin-branch/doctor-details}"><i class="fas fa-fw fa-user-md"></i><span>Doctor Details</span></a></li>
    <li class="nav-item"><a class="nav-link" th:href="@{/admin-branch/add-doctor}"><i class="fas fa-fw fa-plus"></i><span>Add Doctor</span></a></li>
    <li class="nav-item active"><a class="nav-link" th:href="@{/admin-branch/edit-my-profile}"><i class="fas fa-fw fa-user"></i><span>My Profile</span></a></li>
  </ul>

  <div id="content-wrapper">
    <div class="container-fluid">
      <form th:action="@{/admin-branch/update}" th:object="${profile}" method="POST">
        <input type="hidden" th:field="*{userId}"/>
        <input type="hidden" th:field="*{passwordHash}"/>
        <input type="hidden" th:field="*{enabled}"/>
        <input type="hidden" th:field="*{role}"/>

        <table class="table table-borderless">
          <tr><td><dt>Full Name:</dt></td><td><input type="text" th:field="*{fullName}" class="form-control" required/></td></tr>
          <tr><td><dt>Email:</dt></td><td><input type="email" th:field="*{email}" class="form-control" required readonly/></td></tr>
          <tr><td><dt>Gender:</dt></td><td><input type="text" th:field="*{gender}" class="form-control" required/></td></tr>
          <tr><td><dt>Date of Birth:</dt></td><td><input type="date" th:field="*{dateOfBirth}" class="form-control"/></td></tr>
          <tr><td colspan="2" class="text-center"><input class="btn btn-primary btn-lg" type="submit" value="Update"/></td></tr>
        </table>
      </form>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="../vendor/datatables/jquery.dataTables.js"></script>
<script src="../vendor/datatables/dataTables.bootstrap4.js"></script>
<script src="../vendor/js/sb-admin.min.js"></script>
</body>
</html>

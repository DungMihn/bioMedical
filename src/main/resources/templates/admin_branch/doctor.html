<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
            <title>Admin Branch - Doctor</title>

            <!-- Vendor CSS -->
            <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
                <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
                    <link th:href="@{/vendor/datatables/dataTables.bootstrap4.css}" rel="stylesheet">
                        <link th:href="@{/vendor/css/sb-admin.css}" rel="stylesheet">

                            <!-- Theme (gradient pink → purple → blue) -->
                            <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
                                </head>
                                <body id="page-top">

                                    <!-- Navbar: dùng bg-gradient-theme -->
                                    <nav class="navbar navbar-expand navbar-dark bg-gradient-theme static-top">
                                        <a class="navbar-brand mr-1" th:href="@{/admin-branch/doctor-details}">Doctor+ Admin Branch</a>
                                        <button class="btn btn-link btn-sm text-white order-1 order-sm-0" id="sidebarToggle"><i class="fas fa-bars"></i></button>

                                        <ul class="navbar-nav ml-auto ml-md-0">
                                            <li class="nav-item dropdown no-arrow">
                                                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                                                    <i class="fas fa-user-circle fa-fw"></i>
                                                </a>
                                                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                                                    <div class="dropdown-divider"></div>
                                                    <form th:action="@{/logout}" method="post">
                                                        <button class="dropdown-item" type="submit">Logout</button>
                                                    </form>
                                                </div>
                                            </li>
                                        </ul>
                                    </nav>

                                    <div id="wrapper">
                                        <!-- Sidebar: áp theme + active bằng Thymeleaf -->
                                        <ul class="sidebar navbar-nav">
                                            <li class="nav-item" th:classappend="${activePage}=='appointments' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/appointments}">
                                                    <i class="fas fa-fw fa-calendar"></i><span>Appointments</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='doctor-details' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/doctor-details}">
                                                    <i class="fas fa-fw fa-user-md"></i><span>Doctor Details</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='add-doctor' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/add-doctor}">
                                                    <i class="fas fa-fw fa-plus"></i><span>Add Doctor</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='invoices' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/invoices}">
                                                    <i class="fas fa-fw fa-file-invoice-dollar"></i><span>Invoices</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='schedule' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/schedule}">
                                                    <i class="fas fa-fw fa-calendar-alt"></i><span>Schedule</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='add-user' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/add-user}">
                                                    <i class="fas fa-fw fa-user-plus"></i><span>Add Patient</span>
                                                </a>
                                            </li>
                                            <li class="nav-item" th:classappend="${activePage}=='my-profile' ? ' active'">
                                                <a class="nav-link" th:href="@{/admin-branch/edit-my-profile}">
                                                    <i class="fas fa-fw fa-user"></i><span>My Profile</span>
                                                </a>
                                            </li>
                                        </ul>

                                        <div id="content-wrapper">
                                            <div class="container-fluid">
                                                <!-- Breadcrumb -->
                                                <ol class="breadcrumb">
                                                    <li class="breadcrumb-item"><a th:href="@{/admin-branch/doctor-details}">Dashboard</a></li>
                                                    <li class="breadcrumb-item active">Doctors</li>
                                                </ol>

                                                <!-- Card + DataTable -->
                                                <div class="card mb-3">
                                                    <div class="card-header">
                                                        <i class="fas fa-table"></i> Doctors
                                                    </div>
                                                    <div class="card-body">
                                                        <div class="table-responsive">
                                                            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                                                <thead>
                                                                    <tr>
                                                                        <th>Id</th>
                                                                        <th>Full Name</th>
                                                                        <th>Email</th>
                                                                        <th>Gender</th>
                                                                        <th>Role</th>
                                                                        <th>Last-seen</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <tr th:each="temp : ${users}">
                                                                        <td th:text="${temp.userId}">1</td>
                                                                        <td th:text="${temp.fullName}">John Doe</td>
                                                                        <td th:text="${temp.email}">john@mail.com</td>
                                                                        <td th:text="${temp.gender}">Male</td>
                                                                        <td th:text="${temp.role}">DOCTOR</td>
                                                                        <td th:text="${temp.updatedAt}">—</td>
                                                                    </tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                    <div class="card-footer small text-muted">Doctor+</div>
                                                </div>
                                            </div>

                                            <footer class="sticky-footer">
                                                <div class="container my-auto">
                                                    <div class="copyright text-center my-auto">
                                                        <span>Copyright © Doctor+ 2025</span>
                                                    </div>
                                                </div>
                                            </footer>
                                        </div>
                                    </div>

                                    <!-- Vendor JS -->
                                    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
                                    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
                                    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
                                    <script th:src="@{/vendor/datatables/jquery.dataTables.js}"></script>
                                    <script th:src="@{/vendor/datatables/dataTables.bootstrap4.js}"></script>
                                    <script th:src="@{/vendor/js/sb-admin.min.js}"></script>


                                    </script>
                                </body>
                                </html>

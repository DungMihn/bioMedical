<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="login/images/icons/favicon.ico"/>
    <link rel="stylesheet" type="text/css" href="login/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="login/css/util.css">
    <link rel="stylesheet" type="text/css" href="login/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .btn-show-pass {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .wrap-input100 { position: relative; }
        .wrap-login100 { max-width: 450px; }
        .modal-content { border-radius: 15px; overflow: hidden; }
        .modal-header { justify-content: center; }
        .progress { height: 6px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="limiter">
    <div class="container-login100">
        <div class="wrap-login100 p-l-50 p-r-50 p-t-50 p-b-30">
            <form class="login100-form validate-form" th:action="@{/reset-password}" method="POST">

                <span class="login100-form-title p-b-25">Reset Password</span>

                <!-- hidden token -->
                <input type="hidden" name="token" th:value="${token}"/>

                <!-- New Password -->
                <div class="wrap-input100 m-b-16">
                    <input class="input100" type="password" name="newPassword" id="newPassword" placeholder="New Password" required>
                    <span class="focus-input100"></span>
                    <span class="symbol-input100"><span class="lnr lnr-lock"></span></span>
                    <span class="btn-show-pass"><i class="fa fa-eye"></i></span>
                </div>

                <!-- Confirm Password -->
                <div class="wrap-input100 m-b-16">
                    <input class="input100" type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <span class="focus-input100"></span>
                    <span class="symbol-input100"><span class="lnr lnr-lock"></span></span>
                    <span class="btn-show-pass"><i class="fa fa-eye"></i></span>
                </div>

                <div id="passwordError" class="text-danger m-b-16" style="display:none;">
                    Passwords do not match!
                </div>

                <!-- Submit -->
                <div class="container-login100-form-btn p-t-15">
                    <button type="submit" class="login100-form-btn" onclick="return validatePasswords();">
                        Reset
                    </button>
                </div>

                <!-- Error -->
                <div th:if="${errorMessage}" class="alert alert-danger text-center m-t-15">
                    <span th:text="${errorMessage}"></span>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- ✅ Success Popup -->
<div class="modal fade" id="successModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content text-center">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title w-100">🎉 Success</h5>
      </div>
      <div class="modal-body">
        <p>Password has been reset successfully.</p>
        <p>Redirecting to login in <b><span id="countdown">5</span>s</b>...</p>
        <div class="progress">
          <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 100%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="login/vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="login/vendor/bootstrap/js/bootstrap.min.js"></script>

<script>
function validatePasswords(){
    let pass = document.getElementById("newPassword").value;
    let confirm = document.getElementById("confirmPassword").value;
    if(pass !== confirm){
        document.getElementById("passwordError").style.display = "block";
        return false;
    }
    return true;
}

// Toggle show/hide password
$(".btn-show-pass").on("click", function(){
    let input = $(this).siblings("input");
    if(input.attr("type") === "password"){
        input.attr("type", "text");
        $(this).find("i").removeClass("fa-eye").addClass("fa-eye-slash");
    } else {
        input.attr("type", "password");
        $(this).find("i").removeClass("fa-eye-slash").addClass("fa-eye");
    }
});

// ✅ Show success popup if reset ok
let success = /*[[${success}]]*/ false;
if(success){
    $("#successModal").modal({backdrop: 'static', keyboard: false}).modal("show");

    let counter = 5;
    let progress = 100;
    const interval = setInterval(() => {
        counter--;
        progress -= 20;
        $("#countdown").text(counter);
        $("#progressBar").css("width", progress + "%");

        if(counter <= 0){
            clearInterval(interval);
            window.location.href = '/showMyLoginPage';
        }
    }, 1000);
}
</script>
</body>
</html>

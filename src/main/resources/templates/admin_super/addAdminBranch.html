<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Admin Super - Add Admin Branch</title>

  <!-- Bootstrap / Icons / DataTables / SB Admin -->
  <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
  <link th:href="@{/vendor/datatables/dataTables.bootstrap4.css}" rel="stylesheet">
  <link th:href="@{/vendor/css/sb-admin.css}" rel="stylesheet">

  <!-- Theme màu (đặt CUỐI để override) -->
  <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
</head>

<body id="page-top">
<nav class="navbar navbar-expand navbar-dark bg-gradient-theme static-top">
  <a class="navbar-brand mr-1" href="#">Doctor+ Admin Super</a>
  <button class="btn btn-link btn-sm text-white order-1 order-sm-0" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </button>

  <ul class="navbar-nav ml-auto ml-md-0">
    <li class="nav-item dropdown no-arrow">
      <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-user-circle fa-fw"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post">
          <button class="dropdown-item" type="submit">Logout</button>
        </form>
      </div>
    </li>
  </ul>
</nav>

<div id="wrapper">
  <!-- Sidebar -->
  <ul class="sidebar navbar-nav">
    <li class="nav-item" th:classappend="${activePage}=='branch-list' ? ' active'">
      <a class="nav-link" th:href="@{/admin-super/admin-branch-list}">
        <i class="fas fa-fw fa-users-cog"></i><span> Admin Branch List</span>
      </a>
    </li>
    <li class="nav-item" th:classappend="${activePage}=='add-branch' ? ' active'">
      <a class="nav-link" th:href="@{/admin-super/add-admin-branch}">
        <i class="fas fa-fw fa-user-plus"></i><span> Add Admin Branch</span>
      </a>
    </li>
    <li class="nav-item" th:classappend="${activePage}=='profile' ? ' active'">
      <a class="nav-link" th:href="@{/admin-super/profile}">
        <i class="fas fa-fw fa-id-badge"></i><span> Profile</span>
      </a>
    </li>
  </ul>

  <div id="content-wrapper">
    <div class="container-fluid">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
        <li class="breadcrumb-item active">Add Admin Branch</li>
      </ol>

      <div class="card mb-3">
        <div class="card-header">
          <i class="fas fa-user-plus"></i> Tạo Admin Branch
        </div>
        <div class="card-body">
          <form th:action="@{/admin-super/save-admin-branch}" th:object="${adminBranch}" method="post" class="needs-validation">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Username</label>
                <input th:field="*{username}" class="form-control" required placeholder="Enter username">
              </div>
              <div class="col-md-6 mb-3">
                <label>Full name</label>
                <input th:field="*{fullName}" class="form-control" required placeholder="Enter full name">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Email</label>
                <input th:field="*{email}" type="email" class="form-control" required placeholder="Enter email">
              </div>
              <div class="col-md-6 mb-3">
                <label>Phone</label>
                <input th:field="*{phone}" class="form-control" placeholder="Enter phone number">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Password</label>
                <input th:field="*{passwordHash}" type="password" class="form-control" required placeholder="Enter password">
              </div>
              <div class="col-md-6 mb-3">
                <label>Clinic</label>
                <select name="clinicId" class="form-control">
                  <option th:each="c : ${clinics}" th:value="${c.clinicId}" th:text="${c.name}"></option>
                </select>
              </div>
            </div>

            <div class="text-center">
              <button class="btn btn-primary btn-lg px-5" type="submit">
                <i class="fas fa-save"></i> Save
              </button>
              <a class="btn btn-secondary btn-lg px-4 ml-2" th:href="@{/admin-super/admin-branch-list}">
                Cancel
              </a>
            </div>
          </form>
        </div>
        <div class="card-footer small text-muted">Doctor+</div>
      </div>
    </div>

    <footer class="sticky-footer">
      <div class="container my-auto">
        <div class="copyright text-center my-auto">
          <span>Copyright © Doctor+ 2025</span>
        </div>
      </div>
    </footer>
  </div>
</div>

<!-- Scripts -->
<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/vendor/datatables/jquery.dataTables.js}"></script>
<script th:src="@{/vendor/datatables/dataTables.bootstrap4.js}"></script>
<script th:src="@{/vendor/js/sb-admin.min.js}"></script>
<script th:src="@{/vendor/js/demo/datatables-demo.js}"></script>
</body>
</html>

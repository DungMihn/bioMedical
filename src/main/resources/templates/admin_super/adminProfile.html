<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Admin Super - Profile</title>

  <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
  <link th:href="@{/vendor/css/sb-admin.css}" rel="stylesheet">

  <!-- Theme -->
  <link th:href="@{/css/admin-theme.css}" rel="stylesheet">
</head>
<body id="page-top">
<nav class="navbar navbar-expand navbar-dark bg-gradient-theme static-top">
  <a class="navbar-brand mr-1" href="#">Doctor+ Admin Super</a>
  <button class="btn btn-link btn-sm text-white" id="sidebarToggle"><i class="fas fa-bars"></i></button>

  <ul class="navbar-nav ml-auto ml-md-0">
    <li class="nav-item dropdown no-arrow">
      <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
        <i class="fas fa-user-circle fa-fw"></i>
        <span th:text="${#authentication?.name}">admin</span>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
        <a class="dropdown-item" th:href="@{/admin-super/profile}">
          <i class="fas fa-id-badge mr-2"></i> Profile
        </a>
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post" class="px-3 py-1">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-link p-0" type="submit">
            <i class="fas fa-sign-out-alt mr-2"></i> Logout
          </button>
        </form>
      </div>
    </li>
  </ul>
</nav>

<div id="wrapper">
  <ul class="sidebar navbar-nav">
  <li class="nav-item" th:classappend="${activePage}=='statistics' ? ' active'">
    <a class="nav-link" th:href="@{/admin-super/statistics}">
      <i class="fas fa-fw fa-chart-line"></i><span> Statistics</span>
    </a>
  </li>

  <li class="nav-item" th:classappend="${activePage}=='branch-list' ? ' active'">
    <a class="nav-link" th:href="@{/admin-super/admin-branch-list}">
      <i class="fas fa-fw fa-users-cog"></i><span> Admin Branch List</span>
    </a>
  </li>

  <li class="nav-item" th:classappend="${activePage}=='add-branch' ? ' active'">
    <a class="nav-link" th:href="@{/admin-super/add-admin-branch}">
      <i class="fas fa-fw fa-user-plus"></i><span> Add Admin Branch</span>
    </a>
  </li>

  <li class="nav-item" th:classappend="${activePage}=='profile' ? ' active'">
    <a class="nav-link" th:href="@{/admin-super/profile}">
      <i class="fas fa-fw fa-id-badge"></i><span> Profile</span>
    </a>
  </li>
</ul>


  <div id="content-wrapper">
    <div class="container-fluid">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
        <li class="breadcrumb-item active">Profile</li>
      </ol>

      <div class="card mb-3">
        <div class="card-header"><i class="fas fa-id-badge"></i> Thông tin tài khoản</div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <dl class="row mb-0">
                <dt class="col-sm-4">Username</dt>
                <dd class="col-sm-8" th:text="${me.username}">admin</dd>

                <dt class="col-sm-4">Họ tên</dt>
                <dd class="col-sm-8" th:text="${me.fullName}">Admin Super</dd>

                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8" th:text="${me.email}">admin@doctorplus.com</dd>

                <dt class="col-sm-4">Phone</dt>
                <dd class="col-sm-8" th:text="${me.phone}">0123456789</dd>
              </dl>
            </div>
          </div>
        </div>
        <div class="card-footer small text-muted">Doctor+</div>
      </div>

      <div class="card mb-3">
        <div class="card-header"><i class="fas fa-key"></i> Đổi mật khẩu</div>
        <div class="card-body">
          <div th:if="${pwError}" class="alert alert-danger" th:text="${pwError}"></div>
          <div th:if="${pwSuccess}" class="alert alert-success" th:text="${pwSuccess}"></div>

          <form th:action="@{/admin-super/profile/change-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
              <label>Mật khẩu hiện tại</label>
              <input type="password" name="currentPassword" class="form-control" required>
            </div>

            <div class="form-group">
              <label>Mật khẩu mới</label>
              <input type="password" name="newPassword" class="form-control" required>
            </div>

            <div class="form-group">
              <label>Xác nhận mật khẩu mới</label>
              <input type="password" name="confirmPassword" class="form-control" required>
            </div>

            <div class="text-center mt-3">
              <button class="btn btn-primary px-5" type="submit">
                <i class="fas fa-save"></i> Lưu
              </button>
            </div>
          </form>
        </div>
        <div class="card-footer small text-muted">Doctor+</div>
      </div>

    </div>

    <footer class="sticky-footer">
      <div class="container my-auto">
        <div class="copyright text-center my-auto">
          <span>Copyright © Doctor+ 2025</span>
        </div>
      </div>
    </footer>
  </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/js/sb-admin.min.js}"></script>
</body>
</html>
